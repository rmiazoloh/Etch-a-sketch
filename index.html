<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h2>Etch-a-Sketch</h2>
    </header>
    <div class="container">

        <div id="size-dialog">
            <label for="size-input">Change size of grid</label>
            <input type="number" id="size-input" min="1" max="100">
            <button id="confirm-size">Confirm</button>
        </div>
        <div>
            <input type="checkbox" id="random-color-input" name="color-input"/>
            <label for="random-color-input">Add Random Color</label>
        </div>
        <div>
            <input type="checkbox" id="darker-color-input" name="darker-color-input"/>
            <label for="darker-color-input">Add Darker mode</label>
        </div>
        <div>
            <button id="clear">Clear Grid</button>
        </div>
        <p class="grid-notifications"></p>

        <div class="grid-container">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
